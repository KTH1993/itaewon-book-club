<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Itaewon Book Club meets Sundays at 4pm at Vatos Itaewon, Seoul. What we are reading next, and how to join.">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%97%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:title" content="Itaewon Book Club">
<meta property="og:description" content="The Itaewon Book Club meets Sundays at 4pm at Vatos Itaewon, Seoul. What we are reading next, and how to join.">
<meta name="twitter:card" content="summary">
<title>Itaewon Book Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://covers.openlibrary.org" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500&display=swap">

<style>
  /* ------------------------------------------------------------------
     Itaewon Book Club. One slider, one date, one line.
     Covers come from Open Library when they can be found, and fall back
     to a typographic plate when they cannot.
     ------------------------------------------------------------------ */

  :root {
    --bg: #0a0a0b;
    --ink: #f2f0ec;
    --soft: #96968f;
    --faint: #60605f;
    --line: #1f1f23;
    --line2: #333338;
    --accent: #74bb9e;

    --d: "EB Garamond", Georgia, "Times New Roman", serif;
    --u: "Outfit", "Helvetica Neue", Arial, sans-serif;
    --m: ui-monospace, "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--u);
    font-weight: 300;
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  p { margin: 0; }
  a { color: var(--ink); }

  .w { max-width: 1240px; margin: 0 auto; padding-inline: 40px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    padding-block: 18px;
  }

  header .name { font-family: var(--d); font-size: 16px; letter-spacing: .02em; color: var(--soft); }

  .btn {
    font-family: var(--u);
    font-size: 13px;
    font-weight: 500;
    background: var(--ink);
    color: #0a0a0b;
    border: 1px solid var(--ink);
    border-radius: 0;
    padding: 9px 19px;
    text-decoration: none;
    display: inline-block;
    white-space: nowrap;
    cursor: pointer;
    transition: opacity .3s var(--ease), transform .12s var(--ease);
  }

  .btn:hover { opacity: .84; }
  .btn:active { transform: translateY(1px); }

  /* ---------------- slider ---------------- */

  .stage { position: relative; }

  /* full bleed, clipped at the viewport, so the covers can run off the
     edges without the page itself scrolling sideways */
  .strip-wrap { overflow: hidden; }

  .strip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    height: 600px;
  }

  .bk {
    position: relative;
    flex: none;
    background: #16242b;
    box-shadow: 0 30px 70px -34px #000;
    cursor: pointer;
    border: 0;
    padding: 0;
    overflow: hidden;
    transition: width .5s var(--ease), height .5s var(--ease), opacity .5s var(--ease);
  }

  .bk img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* typographic plate, shown until (or unless) a cover arrives */
  .bk .plate {
    position: absolute;
    inset: 0;
    padding: 26px 24px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    text-align: left;
  }

  /* a real cover carries its own typography, so the plate steps aside */
  .bk.has-cover .plate { display: none; }

  .bk .plate .t { font-family: var(--d); line-height: 1.06; }
  .bk .plate .a { font-family: var(--d); font-style: italic; opacity: .8; margin-top: 6px; }

  .bk[data-pos="far"] { width: 180px; height: 270px; opacity: .2; }
  .bk[data-pos="near"] { width: 250px; height: 375px; opacity: .48; }
  .bk[data-pos="act"] { width: 390px; height: 585px; opacity: 1; box-shadow: 0 50px 100px -34px #000, 0 0 0 1px rgba(255,255,255,.08); }
  .bk[data-pos="off"] { display: none; }

  .bk[data-pos="far"] .plate .t { font-size: 16px; }
  .bk[data-pos="far"] .plate .a { font-size: 11px; }
  .bk[data-pos="near"] .plate .t { font-size: 21px; }
  .bk[data-pos="near"] .plate .a { font-size: 13px; }
  .bk[data-pos="act"] .plate .t { font-size: 38px; }
  .bk[data-pos="act"] .plate .a { font-size: 19px; }

  .bk:hover { opacity: 1; }
  .bk[data-pos="act"]:hover { opacity: 1; }

  /* ---------------- the date ---------------- */

  .meta { text-align: center; margin-top: 44px; }

  .meta .when {
    font-family: var(--m);
    font-size: 10px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .meta .when.past { color: var(--faint); }

  .meta .date {
    font-family: var(--d);
    font-size: clamp(38px, 7vw, 84px);
    line-height: 1;
    margin-top: 14px;
    letter-spacing: -.025em;
    text-wrap: balance;
  }

  .meta .sub { font-family: var(--m); font-size: 12px; color: var(--soft); margin-top: 16px; }
  .meta .sub a { color: var(--soft); text-decoration: none; border-bottom: 1px solid var(--line2); }
  .meta .sub a:hover { color: var(--ink); border-color: var(--soft); }

  .meta .acts { margin-top: 26px; min-height: 38px; }

  /* ---------------- timeline ---------------- */

  .tl { margin-top: 52px; display: flex; align-items: flex-start; gap: 24px; }

  .track { flex: 1; min-width: 0; display: flex; padding-top: 16px; border-top: 1px solid var(--line); }

  .stop {
    flex: 1;
    min-width: 0;
    padding-top: 14px;
    padding-right: 14px;
    margin-top: -17px;
    border: 0;
    border-top: 2px solid transparent;
    background: none;
    text-align: left;
    cursor: pointer;
    font: inherit;
    color: inherit;
    transition: border-color .3s var(--ease);
  }

  .stop .d { font-family: var(--m); font-size: 10px; letter-spacing: .1em; color: var(--faint); transition: color .3s var(--ease); }
  .stop .n { font-family: var(--d); font-size: 14px; margin-top: 5px; color: var(--soft); }
  .stop:hover .d { color: var(--soft); }
  .stop:hover { border-top-color: var(--line2); }
  .stop[aria-current="true"] { border-top-color: var(--accent); }
  .stop[aria-current="true"] .d { color: var(--accent); }

  .arrows { display: flex; gap: 8px; flex: none; padding-top: 14px; }

  .arrow {
    width: 32px;
    height: 32px;
    border: 1px solid var(--line2);
    background: none;
    color: var(--soft);
    font-size: 12px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color .3s var(--ease), color .3s var(--ease), transform .12s var(--ease);
  }

  .arrow:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
  .arrow:active:not(:disabled) { transform: translateY(1px); }
  .arrow:disabled { opacity: .3; cursor: default; }

  /* ---------------- welcome and organiser ---------------- */

  .base {
    margin-top: 84px;
    padding-top: 34px;
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: 1fr max-content;
    gap: 70px;
    align-items: start;
  }

  .base .say { font-family: var(--d); font-size: 27px; line-height: 1.42; letter-spacing: -.008em; }

  .base .org .r { font-family: var(--m); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); }
  .base .org .who { font-family: var(--d); font-size: 31px; line-height: 1.1; margin-top: 9px; }
  .base .org .blank { margin-top: 12px; height: 16px; width: 220px; border-bottom: 1px dashed var(--line2); }

  footer {
    margin-top: 54px;
    padding-block: 16px 36px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    font-family: var(--m);
    font-size: 10.5px;
    color: var(--faint);
  }

  footer a { color: var(--faint); text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a:hover { color: var(--soft); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  @media (max-width: 900px) {
    .strip { gap: 26px; height: 470px; }
    .bk[data-pos="far"] { display: none; }
    .bk[data-pos="near"] { width: 170px; height: 255px; }
    .bk[data-pos="act"] { width: 300px; height: 450px; }
    .bk[data-pos="act"] .plate .t { font-size: 30px; }
    .bk[data-pos="act"] .plate .a { font-size: 16px; }
    .base { grid-template-columns: minmax(0, 1fr); gap: 40px; }
  }

  @media (max-width: 620px) {
    .w { padding-inline: 20px; }
    .strip { gap: 16px; height: 400px; }
    .bk[data-pos="near"] { width: 96px; height: 144px; }
    .bk[data-pos="near"] .plate { padding: 12px 11px; }
    .bk[data-pos="near"] .plate .t { font-size: 13px; }
    .bk[data-pos="near"] .plate .a { font-size: 10px; }
    .bk[data-pos="act"] { width: 240px; height: 360px; }
    .bk[data-pos="act"] .plate .t { font-size: 25px; }
    /* align-items: flex-start shrink-wraps the track in column mode,
       which pushes the dates past the screen edge */
    .tl { flex-direction: column; align-items: stretch; gap: 18px; }
    .track { width: 100%; overflow-x: auto; }
    .stop { min-width: 78px; }
    .arrows { align-self: flex-end; padding-top: 0; }
    .base .say { font-size: 23px; }
    .base .org .who { font-size: 27px; }
  }
</style>
<style>
  html { color-scheme: dark; }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="w">

  <header>
    <span class="name">Itaewon Book Club</span>
    <a class="btn" href="https://www.meetup.com/itaewon-book-club/" target="_blank" rel="noopener">Join on Meetup</a>
  </header>
</div>

<div class="strip-wrap"><div class="strip" id="strip"></div></div>

<div class="w">
  <div class="stage">
    <div class="meta">
      <p class="when" id="when">Next meeting</p>
      <p class="date" id="date">Loading</p>
      <p class="sub" id="sub"></p>
      <p class="acts" id="acts"></p>
    </div>

    <div class="tl">
      <div class="track" id="track"></div>
      <div class="arrows">
        <button class="arrow" type="button" id="prev" aria-label="Previous book">&#8592;</button>
        <button class="arrow" type="button" id="next" aria-label="Next book">&#8594;</button>
      </div>
    </div>
  </div>

  <div class="base">
    <p class="say">Everyone's welcome.<br>Read what you can.<br>Say what you felt.</p>
    <div class="org">
      <p class="r">Organiser</p>
      <p class="who">Christopher Jones</p>
      <div class="blank"></div>
    </div>
  </div>

  <footer>
    <span>Site by Taehwan, taehwan19931213@gmail.com</span>
    <span><a href="https://www.meetup.com/itaewon-book-club/" target="_blank" rel="noopener">meetup.com/itaewon-book-club</a></span>
  </footer>
</div>

<script>
  (function () {
    "use strict";

    var MEETUP = "https://www.meetup.com/itaewon-book-club/";
    var VENUE = "Vatos Itaewon";
    var VENUE_MAP = "https://www.google.com/maps/search/?api=1&query=Vatos+Urban+Tacos+Itaewon";

    /* ------------------------------------------------------------------
       THE ONLY THING YOU NEED TO EDIT.

       Add a meeting by appending to this list, oldest first.
       `cover` is optional and is tried in this order:
         1. whatever you put in `cover`
         2. an Open Library cover looked up from title and author
         3. the typographic plate, using `tint` and `on`

       To pin a specific edition, find it on openlibrary.org, take the
       number out of its cover image URL, and set:
         cover: "https://covers.openlibrary.org/b/id/8231856-L.jpg"
       Or drop a file in images/ and set:
         cover: "images/oblomov.jpg"
       ------------------------------------------------------------------ */
    var BOOKS = [
      {
        date: "2026-07-19",
        title: "The Odyssey",
        author: "Homer",
        cover: "",
        tint: "#d9d2c0", on: "#23211c"
      },
      {
        date: "2026-08-16",
        title: "Resistance, Rebellion, and Death",
        author: "Albert Camus",
        cover: "",
        tint: "#8c2f27", on: "#f4e7d8"
      },
      {
        date: "2026-09-13",
        title: "Oblomov",
        author: "Ivan Goncharov",
        cover: "",
        tint: "#16242b", on: "#eae4d8"
      },
      {
        date: "2026-10-04",
        title: "I Am Dynamite!",
        author: "Sue Prideaux",
        cover: "",
        tint: "#b5471f", on: "#fbf0e2"
      },
      {
        date: "2026-10-25",
        title: "The Last of the Just",
        author: "Andre Schwarz-Bart",
        cover: "",
        tint: "#e6e1d4", on: "#2b2a26"
      },
      {
        date: "2026-11-15",
        title: "American Prometheus",
        author: "Kai Bird and Martin J. Sherwin",
        cover: "",
        tint: "#1e2c38", on: "#e6ebef"
      }
    ];

    var MONTHS = ["January", "February", "March", "April", "May", "June",
                  "July", "August", "September", "October", "November", "December"];
    var SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    var STORE = {
      get: function (k, f) {
        try { var r = window.localStorage.getItem(k); return r === null ? f : JSON.parse(r); }
        catch (e) { return f; }
      },
      set: function (k, v) {
        try { window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* blocked */ }
      }
    };

    function at(iso) {
      var p = iso.split("-");
      return new Date(+p[0], +p[1] - 1, +p[2], 16, 0);
    }

    function ends(iso) { var d = at(iso); d.setHours(20, 0, 0, 0); return d; }
    function longDate(iso) { var d = at(iso); return "Sunday " + d.getDate() + " " + MONTHS[d.getMonth()]; }
    function shortDate(iso) { var d = at(iso); return d.getDate() + " " + SHORT[d.getMonth()]; }

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) { n.className = cls; }
      if (text !== undefined) { n.textContent = text; }
      return n;
    }

    var now = new Date();

    /* the first meeting that has not finished is where the page opens */
    var nextIndex = 0;
    while (nextIndex < BOOKS.length - 1 && ends(BOOKS[nextIndex].date) < now) { nextIndex += 1; }

    var index = nextIndex;

    /* ---------------- build the covers ---------------- */

    var strip = document.getElementById("strip");
    var cards = [];

    BOOKS.forEach(function (book, i) {
      var card = el("button", "bk");
      card.type = "button";
      card.style.background = book.tint;
      card.style.color = book.on;
      card.setAttribute("aria-label", book.title + " by " + book.author);

      var plate = el("div", "plate");
      plate.appendChild(el("p", "t", book.title));
      plate.appendChild(el("p", "a", book.author));
      card.appendChild(plate);

      card.addEventListener("click", function () { go(i); });

      strip.appendChild(card);
      cards.push(card);
      findCover(book, card);
    });

    /* ---------------- covers ----------------
       Any failure at any step leaves the typographic plate in place, so
       a blocked network or a book Open Library does not know about costs
       the page nothing. */

    function showCover(card, url, book) {
      var img = new Image();
      img.alt = "Cover of " + book.title;
      img.addEventListener("load", function () {
        if (img.naturalWidth < 20) { return; }   // Open Library returns a 1px gif for a miss
        card.insertBefore(img, card.firstChild);
        card.classList.add("has-cover");
      });
      img.addEventListener("error", function () { /* plate stays */ });
      img.src = url;
    }

    /* Open Library's title and author fields want clean, single values.
       "I Am Dynamite!: A Life of Nietzsche" and "Kai Bird and Martin J.
       Sherwin" both miss, so trim the title at the subtitle and keep only
       the first author. */
    function bareTitle(t) {
      return t.split(":")[0].replace(/[!?.]+\s*$/, "").trim();
    }

    function firstAuthor(a) {
      return a.split(/\s+and\s+|&|,/)[0].trim();
    }

    function searchUrls(book) {
      var t = bareTitle(book.title);
      var a = firstAuthor(book.author);
      var f = "&limit=6&fields=cover_i";
      return [
        /* English edition first, since the club reads in English */
        "https://openlibrary.org/search.json?q=" + encodeURIComponent(t + " " + a) + "&language=eng" + f,
        "https://openlibrary.org/search.json?q=" + encodeURIComponent(t + " " + a) + f,
        "https://openlibrary.org/search.json?title=" + encodeURIComponent(t) + f
      ];
    }

    function findCover(book, card) {
      if (book.cover) { showCover(card, book.cover, book); return; }

      var key = "ibc.cover.v2." + book.date;
      var cached = STORE.get(key, null);

      if (cached) {
        showCover(card, "https://covers.openlibrary.org/b/id/" + cached + "-L.jpg", book);
        return;
      }

      if (!window.fetch) { return; }

      var urls = searchUrls(book);

      /* Try each query in turn. A miss is not cached, so a book that Open
         Library indexes later picks up its cover on a future visit. */
      function attempt(i) {
        if (i >= urls.length) { return; }

        fetch(urls[i]).then(function (r) {
          return r.ok ? r.json() : null;
        }).then(function (data) {
          var docs = (data && data.docs) || [];
          var id = null;

          for (var j = 0; j < docs.length; j += 1) {
            if (docs[j].cover_i) { id = docs[j].cover_i; break; }
          }

          if (id) {
            STORE.set(key, id);
            showCover(card, "https://covers.openlibrary.org/b/id/" + id + "-L.jpg", book);
          } else {
            attempt(i + 1);
          }
        }).catch(function () { /* offline, blocked, or CORS. plate stays */ });
      }

      attempt(0);
    }

    /* ---------------- timeline ---------------- */

    var track = document.getElementById("track");
    var stops = [];

    BOOKS.forEach(function (book, i) {
      var stop = el("button", "stop");
      stop.type = "button";
      stop.setAttribute("aria-label", shortDate(book.date) + ", " + book.title);
      stop.appendChild(el("p", "d", shortDate(book.date)));
      stop.appendChild(el("p", "n"));
      stop.addEventListener("click", function () { go(i); });
      track.appendChild(stop);
      stops.push(stop);
    });

    /* ---------------- selection ---------------- */

    var whenEl = document.getElementById("when");
    var dateEl = document.getElementById("date");
    var subEl = document.getElementById("sub");
    var actsEl = document.getElementById("acts");
    var prevBtn = document.getElementById("prev");
    var nextBtn = document.getElementById("next");

    function go(i) {
      index = Math.min(Math.max(i, 0), BOOKS.length - 1);
      paint();
    }

    function paint() {
      var book = BOOKS[index];

      cards.forEach(function (card, i) {
        var d = Math.abs(i - index);
        card.dataset.pos = d === 0 ? "act" : d === 1 ? "near" : d === 2 ? "far" : "off";
      });

      stops.forEach(function (stop, i) {
        stop.setAttribute("aria-current", i === index ? "true" : "false");
        stop.querySelector(".n").textContent = i === index ? book.title : "";
      });

      var isPast = ends(book.date) < new Date();

      whenEl.textContent = isPast ? "Already read" : index === nextIndex ? "Next meeting" : "Coming up";
      whenEl.className = isPast ? "when past" : "when";

      dateEl.textContent = longDate(book.date);

      subEl.textContent = "";
      if (isPast) {
        subEl.appendChild(document.createTextNode(book.title + ", " + book.author));
      } else {
        subEl.appendChild(document.createTextNode("4:00 pm at "));
        var a = el("a", null, VENUE);
        a.href = VENUE_MAP;
        a.target = "_blank";
        a.rel = "noopener";
        subEl.appendChild(a);
      }

      actsEl.textContent = "";
      if (!isPast) {
        var rsvp = el("a", "btn", "RSVP");
        rsvp.href = MEETUP;
        rsvp.target = "_blank";
        rsvp.rel = "noopener";
        actsEl.appendChild(rsvp);
      }

      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === BOOKS.length - 1;
    }

    prevBtn.addEventListener("click", function () { go(index - 1); });
    nextBtn.addEventListener("click", function () { go(index + 1); });

    document.addEventListener("keydown", function (e) {
      if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) { return; }
      if (e.key === "ArrowLeft") { go(index - 1); }
      if (e.key === "ArrowRight") { go(index + 1); }
    });

    /* swipe */
    var x0 = null;
    strip.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
    strip.addEventListener("touchend", function (e) {
      if (x0 === null) { return; }
      var dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 45) { go(index + (dx < 0 ? 1 : -1)); }
      x0 = null;
    }, { passive: true });

    paint();
  }());
</script>
</body>
</html>
